# Alethic Insight 官网 — 腾讯云轻量源站（nginx）
# 配置位置：/etc/nginx/sites-available/alethicinsight → sites-enabled 软链
#
# 2026-08-09 起：公网流量全部经 Cloudflare Tunnel（cloudflared → http://127.0.0.1:80）。
# TLS 在 Cloudflare 边缘终止，源站不再监听 443，站点内容只对本机回源暴露。
# 源站证书由 acme.sh dns_tencent（DNS-01）续期，不依赖 HTTP 监听，443 关闭不影响续期。
# 警告：不要在隧道回源的 vhost 上加 80→443 跳转——访客已在 CF 边缘完成 HTTPS，
#       源站跳转会造成循环重定向。

server {
    listen 127.0.0.1:80;
    server_name alethicinsight.com www.alethicinsight.com;

    root /var/www/alethicinsight/current;
    index index.html;

    # 招新平台（FastAPI/uvicorn 127.0.0.1:8901）：strip /recruitment/ 前缀后反代。
    # 详细部署说明见 recruitment 仓库 server/deploy/README.md。
    location = /recruitment {
        # 隧道回源是 http，nginx 默认会拼出绝对 http:// Location；
        # 关掉绝对化保持相对 Location（浏览器/CF 都能正确处理）
        absolute_redirect off;
        return 301 /recruitment/;
    }
    location /recruitment/ {
        proxy_pass http://127.0.0.1:8901/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # vite 指纹产物长缓存；HTML/JSON 短缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(html|json)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # public/ 下的静态资源（图片/字体/PDF/视频，文件名不带指纹）：7 天缓存，
    # 带 Cache-Control 后 CF 边缘会缓存这些类型，回源流量基本归零
    location ~* \.(png|jpe?g|webp|gif|svg|ico|woff2?|ttf|otf|pdf|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# 公网 80 唯一监听：其余四个域名的兜底跳转（CF 侧已有页面规则 301 到 com）。
# 同时作为该 socket 的默认 server——所有直连源站 80 的杂散请求（含 Host 为 com 的）
# 一律 301 到 CF 边缘的 https，源站内容不外泄。
server {
    listen 80 default_server;
    server_name alethicinsight.cn alethicinsight.org aletheion.cn aletheion.org.cn;

    location /.well-known/ { root /var/www/acme; }
    location / { return 301 https://alethicinsight.com$request_uri; }
}

# 443 不再监听：原 ssl server 块已移除（历史备份见 alethicinsight.bak-*）。
# TLS 证书链：访客 → CF 边缘（Google Trust Services）→ 隧道加密 → 本机 HTTP。
